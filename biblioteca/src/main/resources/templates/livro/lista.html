<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros</title>
</head>
<body>

<h1>Livros cadastrados</h1>

<p th:if="${#lists.isEmpty(livros)}">Nenhum livro cadastrado.</p>

<ul>
    <li th:each="livro : ${livros}"
        th:text="${livro.titulo} + ' - ' + ${livro.autor} + ' (' + ${livro.isbn} + ')'"></li>
</ul>

<a th:href="@{/livros/novo}">Novo livro</a>

</body>
</html>
